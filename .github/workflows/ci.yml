name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sgbr
          POSTGRES_PASSWORD: sgbr
          POSTGRES_DB: sgbr_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sgbr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://sgbr:sgbr@localhost:5433/sgbr_test
      DATABASE_URL_TEST: postgres://sgbr:sgbr@localhost:5433/sgbr_test
      PAYLOAD_SECRET: ci-secret-not-for-production-0123456789
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
