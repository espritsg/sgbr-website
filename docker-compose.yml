# Local development database. Production uses Neon (see docs/deployment.md).
# Port 5433 on the host so it does not collide with other local Postgres instances.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgbr
      POSTGRES_PASSWORD: sgbr
      POSTGRES_DB: sgbr
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgbr']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
